schema_version: "1.1"
name: neg-restyle-request
description: A request to restyle the page in place; design-audit must not fire.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "messy-pricing.html looks cluttered and dated. Restyle it in place so it looks clean and modern."
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Edit, Write, Skill]
graders:
  - name: skill-not-invoked
    type: tool_used
    tool: Skill
    input_match: design-audit
    min: 0
    max: 0
    arm: both
