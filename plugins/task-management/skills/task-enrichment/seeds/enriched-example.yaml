# Example 2: User-Involved Task (Owner Verification)
- id: VER-001
  title: "Owner: verify 3 facts on the Код 95 page (pricing / term / Poland)"
  area: fact-check
  status: in_progress
  priority: high
  owner: pm
  article: kartka-vodiia-chy-kod-95
  page: /kod-95/
  target: sanity
  blockedBy: []
  context: |
    Потрібне підтвердження власника для сторінки «Код 95 для водія» (/kod-95/):
    1. FAQ «Як зробити код 95 в Україні?»: зараз указано «Вартість платної консультації… 7500 грн».
       Уточнити: 7500 грн — це офіційний державний платіж чи вартість консультації Центру?
       Який окремий державний збір за оформлення (якщо є)?
    2. FAQ «Як швидко можна зробити код 95?»: зараз «в середньому два тижні». Який реальний
       строк з урахуванням навчання, іспиту та виготовлення картки?
    3. FAQ «Код 95 в Польщі» і «Що таке Код 95?»: підтвердити або виправити твердження
       «Український Код 95 не підходить для Польщі» та вимогу картки під час руху через Польщу
       «навіть на підставі дозволу».
    Після підтверджень застосувати правки у SVC-001.
  source: article-driver-card-vs-code-95-ua.md
  
  # === ENRICHED FIELDS ===
  acceptanceCriteria:
    - id: AC-1
      text: "Owner confirms: is 7500 грн government fee or Center's consultation fee?"
      verification:
        type: manual
    - id: AC-2
      text: "Owner confirms realistic timeline for Code 95 completion"
      verification:
        type: manual
    - id: AC-3
      text: "Owner confirms: does Ukrainian Code 95 work in Poland?"
      verification:
        type: manual
  
  complexity: 8
  executionMode: human-only
  
  requiredContext:
    - "Page: /kod-95/"
    - "Article: article-driver-card-vs-code-95-ua.md"
    - "FAQ sections: pricing, timeline, Poland"
  
  executionSteps:
    - 1. "Open the page /kod-95/ in browser"
    - 2. "Locate FAQ 'Як зробити код 95 в Україні?'"
    - 3. "Confirm: is 7500 грн the government fee or Center's consultation fee?"
    - 4. "Locate FAQ 'Як швидко можна зробити код 95?'"
    - 5. "Confirm: what is the realistic timeline including training, exam, and card production?"
    - 6. "Locate FAQ 'Код 95 в Польщі'"
    - 7. "Confirm: does Ukrainian Code 95 work in Poland?"
    - 8. "Reply with your answers to all 3 questions"

