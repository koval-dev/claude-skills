# Example 4: Simple Technical Task (Link Fix)
- id: DOM-001
  title: "Replace all ліцензії.укр with лицензии.укр in raw articles"
  area: naming
  status: in_progress
  priority: high
  owner: editor
  article: null
  page: null
  target: sanity
  blockedBy: []
  context: |
    The registered domain is лицензии.укр (= xn--e1aebcanq4e.xn--j1amh).
    The Ukrainian-looking «ліцензії.укр» is a DIFFERENT, unregistered domain.
    Replace all occurrences in raw article files.
  source: raw/articles/
  
  # === ENRICHED FIELDS ===
  acceptanceCriteria:
    - id: AC-1
      text: "No occurrences of ліцензії.укр in raw articles"
      verification:
        type: grep
        command: "grep -r 'ліцензії.укр' raw/articles/ --include='*.md' -l | wc -l"
        expected: "output == 0"
    - id: AC-2
      text: "All occurrences replaced with лицензии.укр"
      verification:
        type: grep
        command: "grep -r 'лицензии.укр' raw/articles/ --include='*.md' -l | wc -l"
        expected: "output >= 1"
  
  complexity: 2
  executionMode: autonomous
  
  requiredContext:
    - "Directory: raw/articles/"
    - "Wrong spelling: ліцензії.укр"
    - "Correct spelling: лицензии.укр"
  
  validationCommands:
    - "grep -r 'ліцензії.укр' raw/articles/ --include='*.md' -l"
    - "grep -r 'лицензии.укр' raw/articles/ --include='*.md' -l"
  
  guardrails:
    - "Do not change brand name (Центр Ліцензій), only domain spelling"
    - "Do not modify URLs that are already correct"
