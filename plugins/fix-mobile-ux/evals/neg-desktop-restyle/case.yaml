schema_version: "1.1"
name: neg-desktop-restyle
description: A desktop visual-restyle request; fix-mobile-ux must not fire.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "The about page at src/pages/about/index.html looks plain on desktop. Give it a more distinctive, editorial look."
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Edit, Write, Skill]
graders:
  - name: skill-not-invoked
    type: tool_used
    tool: Skill
    input_match: fix-mobile-ux
    min: 0
    max: 0
    arm: both
