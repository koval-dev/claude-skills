schema_version: "1.1"
name: audit-only-component
description: Audit-only mode on a React booking form; must report ranked findings and edit nothing.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/fix-mobile-ux audit-only src/components/BookingForm.tsx"
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: no-edits
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
  - name: no-writes
    type: tool_used
    tool: Write
    min: 0
    max: 0
    arm: both
  - name: ranked-by-priority
    type: regex
    pattern: "\\bP[01]\\b"
  - name: findings-cover-the-form
    type: llm
    weight: 2
    criteria: |
      - Flags placeholder-only fields with no visible labels.
      - Flags missing input types, inputmode, or autocomplete for email, phone, and date.
      - Flags the 24px-tall buttons as undersized touch targets.
      - Flags the fixed 420px form width as overflowing narrow screens.
      - Flags alert() error handling and the missing loading or submitting state.
      - Findings carry priority labels from P0 to P3; a level with no findings may be omitted.
      - Findings are about BookingForm.tsx only. Pointing a fix at the project's existing tokens or styles is allowed and is not auditing another file.
